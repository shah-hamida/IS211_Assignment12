<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Results</title>
</head>
<body>
    <h1>Student Results</h1>
    {% if results %}
    <table border="1">
        <tr>
            <th>Quiz Id</th>
            <th>Score</th>
        </tr>

        {% for result in results%}
        <tr>
            <td>{{ result[0] }}</td>
            <td>{{ result[1] }}</td>
        </tr>
        {%endfor%}
    </table>
    {% else%}
    <p>No Results</p>
    {% endif%}

    <a href="/dashboard">Back</a>
</body>
</html>
