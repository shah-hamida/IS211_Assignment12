<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Quiz</title>
</head>
<body>
    <h1>Add Quiz</h1>
    <form method="POST">
        Subject: <input type="text" name="subject">
        <br><br>
        Number of Questions: <input type="number" name="number_questions">
        <br><br>
        Date: <input type="date" name="quiz_date">
        <br><br>
        <button type="submit">Add Quiz</button>
    </form>

</body>
</html>
