<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Quiz Results</title>
</head>
<body>
  <h1>Add Quiz Results</h1>
  <form method="POST">
    Student: <select name="student_id">
    {% for student in students %}
    <option value="{{ student[0] }}">
      {{ student[1] }}
      {{ student [2] }}
    </option>
    {% endfor%}
  </select><br><br>
    Quiz: <select name="quiz_id">
    {% for quiz in quizzes%}
    <option value="{{ quiz[0]}}">
      {{ quiz[1] }}
    </option>
    {% endfor %}
  </select><br><br>
    Score: <input type="number" name="score">
    <br><br>
    <button type="submit">Add Result</button>

  </form>
</body>
</html>
